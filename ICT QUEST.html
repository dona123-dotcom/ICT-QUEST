<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ICT Quest | Learn • Play • Achieve</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Manrope:wght@500;600;700;800&display=swap');
:root{
  --ink:#17243c;--muted:#66738c;--blue:#5268f5;--cyan:#19c7d7;--pink:#f28bb6;--gold:#ffd166;
  --bg:#f4f6ff;--card:#fff;--line:#e8ebf5;--green:#16a879;--shadow:0 14px 40px #25356b12;
  --addie-ink:#202044;--addie-muted:#686887;--purple:#7057d9;--purple2:#9a7bff;
  --mint:#70d9c4;--cream:#fffaf5;--lav:#f2edff;--addie-line:#e6e0f5;--deck-shadow:0 24px 70px #29205226;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 'DM Sans',Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}
h1,h2,h3{font-family:Manrope,'DM Sans',sans-serif}
button,input,select{font:inherit}button{cursor:pointer;border:0}a{color:inherit;text-decoration:none}

.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
.side{background:#111a35;color:#fff;padding:25px 17px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:12px;padding:5px 8px 28px}
.logo{width:43px;height:43px;border-radius:15px;background:linear-gradient(135deg,#20d3d9,#6a6bff);display:grid;place-items:center;font-size:22px}
.brand b{font-size:17px;letter-spacing:.2px}.brand small{display:block;color:#aeb9d7;font-size:11px}
.navlabel{font-size:10px;color:#7f8bab;letter-spacing:1.6px;padding:15px 12px 7px}
.nav button{width:100%;display:flex;align-items:center;gap:12px;text-align:left;padding:12px;border-radius:12px;color:#c4cce0;background:transparent;margin:3px 0}
.nav button.active,.nav button:hover{background:#26345c;color:#fff}
.nav .ico{width:22px;text-align:center;font-size:17px}
.sidefoot{margin-top:28px;padding:14px;border:1px solid #334064;border-radius:14px;color:#b8c2dc;font-size:12px}
.main{min-width:0;padding:28px clamp(16px,4vw,52px) 60px;max-width:1500px;width:100%;margin:auto}
.top{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:27px}
.crumb{font-size:12px;color:var(--muted)}.topright{display:flex;align-items:center;gap:10px}
.pill{border-radius:30px;background:#fff;padding:8px 13px;font-size:12px;border:1px solid var(--line)}
.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:#e9eaff;color:var(--blue);font-weight:800}
.hero{background:linear-gradient(115deg,#202d63,#5268f5 58%,#21c4d1);border-radius:25px;padding:35px;color:white;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.hero:after{content:"✦";position:absolute;font-size:220px;right:7%;top:-55px;color:#ffffff18}
.hero .eyebrow{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:#c9e9ff}
.hero h1{font-size:clamp(28px,4vw,44px);line-height:1.13;margin:10px 0;max-width:650px}
.hero p{color:#e1eaff;max-width:570px;margin:0 0 22px}
.btn{padding:11px 17px;border-radius:12px;background:var(--blue);color:white;font-weight:700;box-shadow:0 6px 15px #5268f533}
.btn.light{background:#fff;color:#3447bb}.btn.ghost{background:#eef0ff;color:#4858cb;box-shadow:none}.btn.dark{background:#182342}.btn.small{padding:7px 11px;font-size:12px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:19px 0 28px}
.stat,.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow)}
.stat{display:flex;align-items:center;gap:13px}.stat .sico{width:43px;height:43px;border-radius:14px;background:#eef0ff;display:grid;place-items:center;font-size:20px}
.stat strong{font-size:23px;display:block;line-height:1.1}.stat small{color:var(--muted);font-size:11px}
.sectionhead{display:flex;justify-content:space-between;align-items:end;gap:15px;margin:26px 0 13px}
.sectionhead h2{font-size:21px;margin:0}.sectionhead p{margin:3px 0 0;color:var(--muted);font-size:12px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}
.lesson{display:flex;gap:15px;align-items:flex-start;position:relative}
.lessonicon{width:52px;height:52px;flex:none;border-radius:16px;display:grid;place-items:center;font-size:25px;background:#eef2ff}
.lesson h3{font-size:15px;margin:0 0 4px}.lesson p{font-size:12px;color:var(--muted);margin:0 0 12px}
.tag{display:inline-block;border-radius:30px;padding:4px 8px;background:#f0f2ff;color:#5363cf;font-size:10px;font-weight:700;margin:0 4px 4px 0}
.progress{height:7px;border-radius:10px;background:#edf0f7;overflow:hidden;margin:9px 0}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--cyan));border-radius:10px}
.muted{color:var(--muted)}.hidden{display:none!important}

.lessonhead{background:linear-gradient(110deg,#25356c,#566af4);color:white;border-radius:22px;padding:22px 25px;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;gap:18px}
.lessonhead-copy{min-width:0;flex:1}
.lessonhead h1{margin:4px 0;font-size:25px;max-width:850px}.lessonhead p{margin:0;color:#e1e7ff;font-size:14px}
.lesson-map-shortcut{flex:none;background:#ffffff20;border:1px solid #ffffff70;color:#fff;border-radius:15px;padding:11px 14px;font-weight:800;display:flex;align-items:center;gap:9px}
.lesson-map-shortcut:hover{background:#ffffff35}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.tabs button{background:#fff;border:1px solid var(--line);border-radius:30px;padding:8px 14px;font-size:12px;color:var(--muted);font-weight:700}
.tabs button.active{background:#26366e;color:white;border-color:#26366e}

/* Unified ADDIE Slide Deck across ALL lessons */
.slide-stage{
  position:relative;
  border-radius:28px;
  padding:22px 22px 68px;
  background:radial-gradient(ellipse at 10% 0%,#51417c 0,transparent 42%),radial-gradient(ellipse at 95% 100%,#3e6c77 0,transparent 40%),#211c3d;
  box-shadow:var(--deck-shadow);
  overflow:hidden;
}
.slide-stage:fullscreen,.slide-stage:-webkit-full-screen{
  border-radius:0;padding:24px;display:flex;align-items:center;justify-content:center;width:100vw;height:100vh;
}
.slide-stage:fullscreen .addie-slide,.slide-stage:-webkit-full-screen .addie-slide{
  width:min(1240px,95vw);height:min(710px,87vh);
}
.deck-topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;padding:0 6px;color:#e8e3ff;font-size:11px;letter-spacing:.04em}
.deck-dots{display:flex;gap:6px;flex-wrap:wrap}
.deck-dot{width:26px;height:7px;border-radius:99px;background:#ffffff30;cursor:pointer;transition:.2s;border:0;padding:0}
.deck-dot.active{background:linear-gradient(90deg,var(--pink),var(--mint));width:38px}

.addie-slide{
  display:none;
  width:100%;
  min-height:560px;
  background:var(--cream);
  color:var(--addie-ink);
  border-radius:28px;
  box-shadow:0 24px 80px #120c2c55;
  position:relative;
  overflow:hidden;
  padding:42px 52px 58px;
}
.addie-slide.active{display:flex;flex-direction:column;animation:slideIn .28s ease-out}
@keyframes slideIn{from{opacity:.35;transform:translateY(10px) scale(.995)}to{opacity:1;transform:none}}
.addie-slide:before{content:"";position:absolute;width:340px;height:340px;border-radius:50%;background:#e7defd;right:-160px;top:-175px;opacity:.72;pointer-events:none}
.addie-slide:after{content:"";position:absolute;width:210px;height:210px;border-radius:50%;background:#d8f6ed;left:-120px;bottom:-135px;opacity:.82;pointer-events:none}
.addie-content{position:relative;z-index:1;display:flex;flex-direction:column;flex:1;justify-content:space-between}
.addie-kicker{font-size:12px;text-transform:uppercase;letter-spacing:.17em;font-weight:800;color:var(--purple);margin-bottom:10px;display:flex;align-items:center;gap:9px}
.addie-kicker:before{content:"";width:25px;height:3px;background:var(--pink);border-radius:3px}
.addie-slide h1{font-size:clamp(30px,4vw,52px);line-height:1.06;letter-spacing:-.045em;margin:0 0 14px;color:var(--addie-ink)}
.addie-slide h2{font-size:clamp(24px,2.8vw,36px);line-height:1.12;letter-spacing:-.035em;margin:0 0 16px;color:var(--addie-ink)}
.addie-slide h3{font-size:18px;line-height:1.25;margin:0 0 8px;color:var(--addie-ink)}
.addie-slide p{font-size:15px;line-height:1.58;color:#535370;margin:0 0 10px}
.addie-lead{font-size:18px;line-height:1.52;max-width:820px;color:#64617f;margin-bottom:14px}
.addie-pill{display:inline-flex;align-items:center;background:#eee8ff;color:#5a42b8;border-radius:99px;padding:8px 14px;font-weight:800;font-size:12px;width:max-content}

.addie-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px;margin-top:4px}
.addie-grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.addie-card{background:#fff;border:1px solid var(--addie-line);border-radius:20px;padding:18px 20px;box-shadow:0 6px 20px #3b2b6d0b;transition:transform .2s,box-shadow .2s,border-color .2s}
.addie-card:hover{transform:translateY(-3px);box-shadow:0 14px 28px #3b2b6d16;border-color:#c8b9ff}
.addie-card p,.addie-card li{font-size:14px;line-height:1.5;color:#535370}
.addie-card ul{margin:8px 0 0;padding-left:20px}
.addie-icon{font-size:26px;margin-bottom:8px}
.addie-callout{background:#e7f8f2;border-left:5px solid var(--mint);border-radius:14px;padding:13px 17px;margin-top:14px;font-size:14px;line-height:1.5;color:#315d56}

/* Unified Hero & Closing Slide Theme across ALL lessons */
.addie-slide.hero-slide,.addie-slide.end-slide{background:linear-gradient(130deg,#30254f 0%,#55428a 52%,#2d6f77 100%);color:white}
.addie-slide.hero-slide:before,.addie-slide.end-slide:before{background:#b7a2ff;opacity:.18}
.addie-slide.hero-slide:after,.addie-slide.end-slide:after{background:#8ee6cf;opacity:.16}
.addie-slide.hero-slide h1,.addie-slide.end-slide h1{color:white}
.addie-slide.hero-slide p,.addie-slide.end-slide p{color:#e8e3ff}
.addie-slide.hero-slide .addie-kicker,.addie-slide.end-slide .addie-kicker{color:#aef4e2}
.addie-slide.hero-slide .addie-content{justify-content:center;max-width:74%}
.addie-slide.hero-slide .addie-pill{background:#ffffff20;color:white;border:1px solid #ffffff28}
.addie-hero-art{position:absolute;right:6%;bottom:14%;width:250px;height:250px;display:grid;place-items:center;pointer-events:none}
.addie-orbit{position:absolute;border:1px solid #ffffff65;border-radius:50%;width:240px;height:240px;animation:addieSpin 22s linear infinite}
.addie-orbit:before,.addie-orbit:after{content:"";position:absolute;width:16px;height:16px;border-radius:50%;background:var(--mint);top:28px;left:24px;box-shadow:0 0 22px #70d9c4}
.addie-orbit:after{background:var(--pink);top:auto;left:auto;bottom:22px;right:14px}
@keyframes addieSpin{to{transform:rotate(360deg)}}
.addie-core{width:148px;height:148px;border-radius:36px;background:linear-gradient(140deg,#a38aff,#6f57d9);display:grid;place-items:center;font-size:58px;box-shadow:0 22px 45px #100b2c65;transform:rotate(-7deg)}
.addie-slide.end-slide .addie-content{justify-content:center;align-items:center;text-align:center}
.addie-slide.end-slide .addie-card{background:#fffdfd;border-color:#e4dcfa;text-align:left}
.addie-slide.end-slide .addie-card h3{color:#292449}
.addie-slide.end-slide .addie-card p{color:#55516f}

/* Unified Concept & Step Colors across ALL lessons */
.concept-tap{cursor:pointer;position:relative}
.concept-tap.selected{border-color:var(--purple2);background:#faf8ff;box-shadow:0 12px 26px #7057d924}
.concept-tap .tap-hint{font-size:11px;font-weight:800;color:var(--purple);margin-top:8px;display:inline-block}
.concept-title-0{color:#7057d9!important}
.concept-title-1{color:#168c7c!important}
.concept-title-2{color:#c34b83!important}

.addie-steps{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:10px 0}
.addie-step{border-radius:18px;padding:15px 12px;text-align:center;background:white;border:1px solid var(--addie-line);cursor:pointer;transition:.2s}
.addie-step:hover,.addie-step.selected{transform:translateY(-4px);border-color:var(--purple2);box-shadow:0 12px 25px #7057d92b}
.addie-step .letter{width:44px;height:44px;border-radius:14px;margin:0 auto 9px;display:grid;place-items:center;color:white;font-size:16px;font-weight:900}
.addie-step:nth-child(1) .letter{background:var(--purple)}
.addie-step:nth-child(2) .letter{background:#36bfa5}
.addie-step:nth-child(3) .letter{background:#f3b83f;color:#644600}
.addie-step:nth-child(4) .letter{background:#f28bb6;color:#692c4a}
.addie-step strong{display:block;font-size:13px;color:var(--addie-ink)}
.addie-step small{display:block;margin-top:4px;color:var(--addie-muted);font-size:11px}

.addie-list{display:grid;gap:9px}
.addie-list-item{display:flex;gap:12px;align-items:flex-start;background:white;border:1px solid var(--addie-line);border-radius:14px;padding:11px 14px}
.addie-dot{flex:0 0 30px;height:30px;border-radius:10px;background:#eee8ff;color:var(--purple);font-weight:900;display:grid;place-items:center;font-size:13px}
.addie-list-item p{font-size:14px;margin:0}
.addie-reveal{border:1px solid #d8cff5;background:#f6f2ff;color:#5c45b5;padding:10px 14px;border-radius:12px;font-weight:800;cursor:pointer;margin-top:10px;font-size:13px}
.addie-reveal:hover{background:#ece4ff}
.addie-answer{display:none;background:#e7f8f2;color:#315d56;padding:12px 14px;border-radius:12px;margin-top:10px;font-size:13.5px;line-height:1.5;border-left:4px solid var(--mint)}
.addie-answer.show{display:block}
.addie-choice{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--addie-line);border-radius:12px;padding:11px 14px;margin:7px 0;color:var(--addie-ink);font-weight:600;font-size:14px;transition:.15s}
.addie-choice:hover{background:#f2edff;border-color:#b8a8fa}
.addie-choice.correct{background:#e4f8ef;border-color:#69cba8;color:#155e47}
.addie-choice.wrong{background:#fff0f3;border-color:#f3a0b8;color:#8e2a47}

.addie-footer{position:absolute;bottom:16px;left:52px;right:52px;display:flex;align-items:center;justify-content:space-between;color:#9994b0;font-size:11px;z-index:2;letter-spacing:.04em}
.addie-slide.hero-slide .addie-footer,.addie-slide.end-slide .addie-footer{color:#c7c0eb}

.deck-controls{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:9px;padding:6px 10px;background:#fffefaed;border:1px solid #ffffff88;border-radius:99px;box-shadow:0 8px 26px #100b2c45;z-index:10}
.deck-controls button{border:0;background:var(--purple);color:white;border-radius:50%;width:34px;height:34px;font-size:18px;cursor:pointer;transition:.15s;display:grid;place-items:center}
.deck-controls button:hover{background:#5139ba;transform:scale(1.06)}
.deck-controls button:disabled{opacity:.28;cursor:not-allowed;transform:none}
.deck-counter{min-width:64px;text-align:center;font-size:12px;font-weight:900;color:var(--addie-ink)}
.deck-progress{position:absolute;bottom:0;left:0;height:5px;background:linear-gradient(90deg,var(--pink),var(--purple2),var(--mint));width:0;transition:width .25s;z-index:11}

/* Quizzes, Games, Tables */
.quizq{padding:16px;border:1px solid var(--line);border-radius:15px;margin:12px 0;background:#fff}
.quizq h3{margin:0 0 10px;font-size:14px}
.option{display:block;padding:9px 11px;border:1px solid var(--line);border-radius:10px;margin:7px 0;cursor:pointer;font-size:13px}
.option:has(input:checked){border-color:var(--blue);background:#f2f3ff}
.feedback{font-weight:700;margin-top:10px;font-size:13px}
.gamegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}
.gamecard{padding:18px;background:#fff;border:1px solid var(--line);border-radius:17px;cursor:pointer;transition:.2s}
.gamecard:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.gamecard .big{font-size:27px}.gamecard h3{margin:7px 0 2px;font-size:15px}.gamecard p{margin:0;color:var(--muted);font-size:12px}
.gamebox{background:#fff;border:1px solid var(--line);padding:22px;border-radius:18px;margin-top:15px}
.scoreboard{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.team{border-radius:16px;padding:17px;color:white}
.team.girls{background:linear-gradient(120deg,#ec5f9b,#ff91bd)}
.team.boys{background:linear-gradient(120deg,#4260d9,#39a8e9)}
.team strong{font-size:29px;display:block}
.team button{background:#ffffff2b;color:white;border:1px solid #ffffff55;border-radius:9px;padding:6px 10px;margin:8px 4px 0 0}
.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.field{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;min-width:0}
.table{width:100%;border-collapse:collapse;font-size:13px}
.table th,.table td{text-align:left;padding:11px;border-bottom:1px solid var(--line)}
.table th{color:var(--muted);font-size:11px}
.empty{text-align:center;padding:30px;color:var(--muted)}
.notice{background:#fff8e9;border:1px solid #ffe7b6;color:#805a12;padding:12px 14px;border-radius:13px;font-size:12px;margin:14px 0}

/* Sketchbook Pastel Mind Map (Inspired by Reference Layout) */
.mindmap-wrap{
  background:#faf6ee;
  border:1.5px solid #2b283322;
  border-radius:24px;
  padding:22px;
  box-shadow:0 14px 36px #23203314;
}
.mm-ref-stage{
  background:#faf6ee;
  border:1.5px solid #23212926;
  border-radius:20px;
  padding:16px;
  overflow-x:auto;
}
.mm-ref-stage svg{
  width:100%;
  min-width:820px;
  height:auto;
  display:block;
}
.mm-ref-text{
  font-family:'DM Sans',Manrope,sans-serif;
  fill:#232129;
  font-weight:700;
}
.mm-ref-title{
  font-family:Manrope,'DM Sans',sans-serif;
  fill:#232129;
  font-weight:800;
}
.mm-ref-sub{
  font-family:'DM Sans',sans-serif;
  fill:#373444;
  font-weight:600;
}

/* Enhanced Polish & Consistent Lesson Presentation (v3) */
.lessonhead{
  background:linear-gradient(120deg,#262147 0%,#52438f 55%,#276d78 100%);
  border:1px solid #ffffff2b;
  box-shadow:0 18px 42px #211a4224;
}
.tabs button{
  padding:9px 16px;
  font-size:12.5px;
  box-shadow:0 4px 12px #25356b08;
  transition:.18s ease;
}
.tabs button:hover{
  transform:translateY(-1px);
  border-color:#c6b8f5;
  color:#202044;
}
.tabs button.active{
  background:linear-gradient(120deg,#52438f,#7057d9);
  border-color:transparent;
  color:#fff;
  box-shadow:0 8px 20px #52438f33;
}
.addie-slide{
  border:1px solid #e5defa;
}
.addie-card{
  border-radius:22px;
  padding:20px 22px;
}
.addie-callout{
  background:linear-gradient(120deg,#e7f8f2 0%,#f2edff 100%);
  border-left:5px solid #52438f;
  color:#232245;
  box-shadow:0 6px 18px #3b2b6d08;
}

/* Full Mind Map Visual Diagram + Branch Cards */
.mm-toolbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:10px;
  margin-bottom:14px;
  padding:10px 14px;
  background:#fff;
  border:1px solid var(--addie-line);
  border-radius:16px;
}
.mm-svg-box{
  background:#fff;
  border:1px solid var(--addie-line);
  border-radius:20px;
  padding:14px;
  margin-bottom:16px;
  overflow:auto;
}
.mm-svg-box svg{
  width:100%;
  min-width:740px;
  height:auto;
  display:block;
}


/* Distinct per-lesson visual themes (v4) */
.slide-stage[data-lesson-theme="0"]{
  --purple:#1f8a70;--purple2:#36b395;--mint:#9be7d8;--pink:#f6bd60;--cream:#f6fbf9;
  background:radial-gradient(ellipse at 10% 0%,#1f6f68 0,transparent 42%),radial-gradient(ellipse at 95% 100%,#2b5876 0,transparent 42%),#162c36;
}
.slide-stage[data-lesson-theme="0"] .addie-slide.hero-slide,
.slide-stage[data-lesson-theme="0"] .addie-slide.end-slide{
  background:linear-gradient(130deg,#134e5e 0%,#1f8a70 55%,#2b5876 100%);
}
.slide-stage[data-lesson-theme="0"] .addie-slide:before{background:#b8efe3}

function wrapMmText(str, maxChars=24){
  const words = String(str||'').trim().split(/\s+/).filter(Boolean);
  if(!words.length) return [''];
  const lines = [];
  let line = '';
  for(const w of words){
    const test = line ? (line + ' ' + w) : w;
    if(test.length <= maxChars){
      line = test;
    } else {
      if(line) lines.push(line);
      line = w;
    }
  }
  if(line) lines.push(line);
  return lines;
}

function makeMindMap(items, lessonObj=null){
  const arr = Array.isArray(items) && items.length ? items : ['Main Topic'];
  const root = arr[0];

  const bChunks = [[], [], []];
  rest.forEach((txt, i) => bChunks[i % 3].push(txt));

  const mainColors = [

    '#ede9fe',
    '#fef3c7',

  ];

  const branches = [0,1,2].map(bi => {
    const raw = bChunks[bi];
    const title = raw[0] || ('Branch ' + (bi+1));
    let subs = raw.slice(1);
    if(subs.length > 3){
      const extra = subs.slice(2).join(' • ');
      subs = [subs[0], subs[1], extra];
    }
    while(subs.length < 3){
      subs.push(lessonObj ? `${lessonObj.title.split(' ').slice(0,3).join(' ')} (${subs.length+1})` : `Key point ${subs.length+1}`);
    }
    return {
      title,
      subs,
      style: mainColors[bi]
    };
  });

  const W = 960;
  const topBannerH = 62;
  const topBannerY = 20;
  const topBannerX = 110;
  const topBannerW = 720;

  const leftBoxX = 24;
  const leftBoxW = 195;
  const leftBoxH = 92;

  const midBoxX = 285;
  const midBoxW = 215;
  const midBoxH = 132;

  const leafX = 565;
  const leafW = 355;
  const leafH = 52;
  const leafGap = 12;

  const blockSpan = 3 * leafH + 2 * leafGap;
  const startBlockY = 112;
  const blockStepY = 212;
  const H = startBlockY + 2 * blockStepY + blockSpan + 46;
  const leftBoxY = Math.round(H * 0.44);

  const renderLines = (lines, x, y, lineH, cls='mm-ref-sub', size=12.5, anchor='start') => {
    const totalH = (lines.length - 1) * lineH;
    const firstY = y - totalH / 2 + 4;
    return lines.map((ln, idx) =>
      `<text x="${x}" y="${firstY + idx * lineH}" class="${cls}" font-size="${size}" text-anchor="${anchor}">${esc(ln)}</text>`
    ).join('');
  };

  const bannerLines = wrapMmText((lessonObj ? lessonObj.icon + ' ' : '') + root, 56);
  const rootLines = wrapMmText(root, 18);

  const midLeftX = leftBoxX + leftBoxW;
  const midLeftY = leftBoxY + leftBoxH / 2;

  let paths = '';
  let branchEls = '';

  branches.forEach((br, bi) => {
    const by = startBlockY + bi * blockStepY;
    const midY = by + blockSpan / 2;
    const mBoxY = by + (blockSpan - midBoxH) / 2;

    paths += `<path d="M ${midLeftX} ${midLeftY} L ${midLeftX + 26} ${midLeftY} L ${midLeftX + 26} ${mBoxY + midBoxH/2} Q ${midLeftX + 26} ${mBoxY + midBoxH/2} ${midBoxX} ${mBoxY + midBoxH/2}" fill="none" stroke="#232129" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>`;

    const bRightX = midBoxX + midBoxW;
    const bracketX = leafX - 34;
    const y0 = by + leafH / 2;
    const y1 = by + leafH + leafGap + leafH / 2;
    const y2 = by + 2 * (leafH + leafGap) + leafH / 2;

    paths += `
      <path d="M ${bRightX} ${midY} L ${bracketX - 10} ${midY}" fill="none" stroke="#232129" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M ${bracketX - 10} ${y0} Q ${bracketX} ${y0} ${bracketX} ${y0 + 14} L ${bracketX} ${midY - 12} Q ${bracketX} ${midY} ${bracketX + 10} ${midY} Q ${bracketX} ${midY} ${bracketX} ${midY + 12} L ${bracketX} ${y2 - 14} Q ${bracketX} ${y2} ${bracketX - 10} ${y2}" fill="none" stroke="#232129" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M ${bracketX - 10} ${y0} L ${leafX} ${y0}" fill="none" stroke="#232129" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M ${bracketX} ${y1} L ${leafX} ${y1}" fill="none" stroke="#232129" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M ${bracketX - 10} ${y2} L ${leafX} ${y2}" fill="none" stroke="#232129" stroke-width="2.2" stroke-linecap="round"/>
    `;

    const mTitleLines = wrapMmText(br.title, 18);
    branchEls += `
      <g>
        <rect x="${midBoxX}" y="${mBoxY}" width="${midBoxW}" height="${midBoxH}" rx="16" fill="${br.style.fill}" stroke="#232129" stroke-width="2.4"/>
        ${renderLines(mTitleLines, midBoxX + midBoxW/2, mBoxY + midBoxH/2, 18, 'mm-ref-title', 14.5, 'middle')}
      </g>
    `;

    br.subs.forEach((subTxt, si) => {
      const sy = by + si * (leafH + leafGap);
      const col = leafPalette[(bi * 3 + si) % leafPalette.length];
      const subLines = wrapMmText(subTxt, 38);
      branchEls += `
        <g>
          <rect x="${leafX}" y="${sy}" width="${leafW}" height="${leafH}" rx="13" fill="${col}" stroke="#232129" stroke-width="2.1"/>
          ${renderLines(subLines, leafX + 14, sy + leafH/2, 15, 'mm-ref-sub', 12.5, 'start')}
        </g>
      `;
    });
  });

  const doodles = `
    <path d="M 892 18 L 896 34 L 912 38 L 896 42 L 892 58 L 888 42 L 872 38 L 888 34 Z" fill="#232129"/>
    <circle cx="834" cy="30" r="3.5" fill="#232129"/>
    <circle cx="870" cy="68" r="3" fill="#232129"/>

    <path d="M 106 82 C 62 96, 74 148, 128 134 C 158 126, 156 102, 128 104 C 82 108, 36 142, 86 190" fill="none" stroke="#232129" stroke-width="2.8" stroke-linecap="round"/>
    <path d="M 56 190 L 87 191 L 84 160" fill="none" stroke="#232129" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>

    <g transform="translate(248, 286)">
      <path d="M 0 12 C -12 0, -24 10, -12 24 L 0 36 L 12 24 C 24 10, 12 0, 0 12 Z" fill="none" stroke="#232129" stroke-width="2.5" stroke-linejoin="round"/>

      <line x1="-32" y1="22" x2="-24" y2="22" stroke="#232129" stroke-width="2.2" stroke-linecap="round"/>
      <line x1="32" y1="22" x2="24" y2="22" stroke="#232129" stroke-width="2.2" stroke-linecap="round"/>
    </g>

    <g transform="translate(245, 520)">
      <path d="M -22 -12 C -27 -18, -34 -12, -27 -4 L -22 1 L -17 -4 C -10 -12, -17 -18, -22 -12 Z" fill="none" stroke="#232129" stroke-width="2.1"/>
      <path d="M 16 -12 C 11 -18, 4 -12, 11 -4 L 16 1 L 21 -4 C 28 -12, 21 -18, 16 -12 Z" fill="none" stroke="#232129" stroke-width="2.1"/>

    <path d="M 122 ${H-52} L 125 ${H-42} L 135 ${H-39} L 125 ${H-36} L 122 ${H-26} L 119 ${H-36} L 109 ${H-39} L 119 ${H-42} Z" fill="#232129"/>
  `;

  return `
  <div class="mindmap-wrap">
    <div class="mm-ref-stage">
      <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(root)} Mind Map">
        <rect x="${topBannerX}" y="${topBannerY}" width="${topBannerW}" height="${topBannerH}" rx="15" fill="#fff0b8" stroke="#232129" stroke-width="2.4"/>
        ${renderLines(bannerLines, topBannerX + topBannerW/2, topBannerY + topBannerH/2, 18, 'mm-ref-title', 16, 'middle')}

        ${paths}

        <rect x="${leftBoxX}" y="${leftBoxY}" width="${leftBoxW}" height="${leftBoxH}" rx="14" fill="#d8f3dc" stroke="#232129" stroke-width="2.4"/>

        ${branchEls}
        ${doodles}
      </svg>
    </div>
  </div>`;
}

function goSlide(n){
  const stage=document.getElementById('lessonDeckStage');
  if(!stage)return;
  const slides=[...stage.querySelectorAll('.addie-slide')];
  const dots=[...stage.querySelectorAll('.deck-dot')];
  slideIdx=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===slideIdx));
  dots.forEach((d,i)=>d.classList.toggle('active',i===slideIdx));
  const c=document.getElementById('slideCounter'),p=document.getElementById('slideProgress'),pr=document.getElementById('slidePrev'),nx=document.getElementById('slideNext');
  if(c)c.textContent=`${slideIdx+1} / ${slides.length}`;
  if(p)p.style.width=`${(slideIdx+1)/slides.length*100}%`;
  if(pr)pr.disabled=slideIdx===0;
  if(nx)nx.disabled=slideIdx===slides.length-1;
}
function moveSlide(delta){goSlide(slideIdx+delta)}
function toggleDeckFull(){
  const stage=document.getElementById('lessonDeckStage');
  if(!stage)return;
  if(!document.fullscreenElement)stage.requestFullscreen?.();
  else document.exitFullscreen?.();
}

function quizHTML(qs,kind){return `<div class="card"><h2>✍️ Knowledge check</h2><p>Choose the best answer for each question. You will see your score when you submit.</p><form id="quizForm">${qs.map((q,i)=>`<div class="quizq"><h3>${i+1}. ${esc(q[0])}</h3>${q[1].map((o,j)=>`<label class="option"><input type="radio" name="q${i}" value="${j}"> ${String.fromCharCode(65+j)}. ${esc(o)}</label>`).join('')}</div>`).join('')}<button class="btn" type="submit">Submit answers</button></form><div id="quizResult"></div></div>`}
document.addEventListener('submit',e=>{if(e.target.id!=='quizForm')return;e.preventDefault();let l=lessons[current],qs=l.questions,score=0;qs.forEach((q,i)=>{let a=e.target.querySelector(`input[name=q${i}]:checked`);if(a&&+a.value===q[2])score++});let id=current,first=!data.done.includes(id);if(first){data.done.push(id);data.xp+=score*10+10}else data.xp+=score*5;data.quiz[id]=score;save();document.getElementById('quizResult').innerHTML=`<div class="notice" style="background:#eafff5;border-color:#bdebd8;color:#12694f"><b>🎉 You scored ${score}/${qs.length}!</b><br>${score===qs.length?'Perfect score! You are an ICT superstar.':'Great effort! Review the lesson and try again to improve.'}<br><button class="btn small" style="margin-top:10px" onclick="go('lessons')">Back to lessons</button></div>`;});

function games(){view.innerHTML=`<div class="hero"><div class="eyebrow">POWER UP YOUR KNOWLEDGE</div><h1>Welcome to the<br>Game Arena! 🎮</h1><p>Pick a game, challenge yourself and collect XP. Every game is a new chance to shine.</p></div><div class="sectionhead"><div><h2>Choose your game mode</h2><p>Play from any of the eight lessons.</p></div></div><div class="gamegrid"><div class="gamecard" onclick="startGame('quiz')"><div class="big">⚡</div><h3>Speed Quiz</h3><p>Multiple-choice questions against the clock (no timer needed).</p></div><div class="gamecard" onclick="startGame('truefalse')"><div class="big">✅</div><h3>True or False</h3><p>Quickly decide whether a statement is correct.</p></div><div class="gamecard" onclick="startGame('challenge')"><div class="big">🎯</div><h3>Mixed Challenge</h3><p>Questions from all eight lessons.</p></div><div class="gamecard" onclick="go('teams')"><div class="big">👑</div><h3>Girls vs Boys</h3><p>Two teams. One classroom champion.</p></div><div class="gamecard" onclick="go('mindmaps')"><div class="big">🧠</div><h3>Mind Map Match</h3><p>Review the key ideas and connections.</p></div><div class="gamecard" onclick="go('students')"><div class="big">🌟</div><h3>Participation Stars</h3><p>Celebrate students who contribute.</p></div></div><div id="gameArea"></div>`}
function startGame(type){activeGame=type;gameIndex=0;gameScore=0;let pool=type==='challenge'?lessons.flatMap((l,li)=>l.questions.map(q=>({q,li}))):lessons[current]?.questions.map(q=>({q,li:current}))||lessons[0].questions.map(q=>({q,li:0}));if(type==='truefalse')pool=pool.map(x=>{let truth=Math.random()>.35,idx=truth?x.q[2]:(x.q[2]+1)%x.q[1].length;return {...x,tf:true,tfTruth:truth,q:[`Is this statement true? “${x.q[1][idx]}”`,['True','False'],truth?0:1]}});window.gamePool=pool.sort(()=>Math.random()-.5).slice(0,5);showGameQuestion()}
function showGameQuestion(){let area=document.getElementById('gameArea');if(!area){area=document.createElement('div');area.id='gameArea';view.append(area)}if(gameIndex>=window.gamePool.length){data.xp+=gameScore*5;save();area.innerHTML=`<div class="gamebox"><h2>🏁 Challenge complete!</h2><p>You earned <b>${gameScore} / ${window.gamePool.length}</b> correct answers and ${gameScore*5} XP.</p><button class="btn" onclick="startGame('${activeGame}')">Play again</button> <button class="btn ghost" onclick="go('games')">Game menu</button></div>`;return}let item=window.gamePool[gameIndex],q=item.q;area.innerHTML=`<div class="gamebox"><div class="row" style="justify-content:space-between"><span class="tag">QUESTION ${gameIndex+1} OF ${window.gamePool.length}</span><b>⭐ ${gameScore} points</b></div><div class="progress"><i style="width:${gameIndex/window.gamePool.length*100}%"></i></div><h2>${esc(q[0])}</h2>${(item.tf?['True','False']:q[1]).map((o,j)=>`<button class="option" style="width:100%;text-align:left" onclick="answerGame(${j})">${item.tf?esc(o):String.fromCharCode(65+j)+'. '+esc(o)}</button>`).join('')}<div id="gameFeedback"></div></div>`}
function answerGame(j){let item=window.gamePool[gameIndex],correct=item.tf?(j===0)===item.tfTruth:j===item.q[2];if(correct)gameScore++;document.getElementById('gameFeedback').innerHTML=`<p class="feedback" style="color:${correct?'#13956c':'#c05b4c'}">${correct?'Correct! 🌟':'Not quite — keep learning!'}</p><button class="btn small" onclick="gameIndex++;showGameQuestion()">Next question →</button>`;document.querySelectorAll('#gameArea .option').forEach(b=>b.disabled=true)}

function addStudent(){let name=document.getElementById('studentName').value.trim(),team=document.getElementById('studentTeam').value;if(!name){alert('Please enter a student name.');return}data.students.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),name,team,count:0});save();students()}
function participate(id){let s=data.students.find(x=>x.id===id);if(s)s.count++;save();students()}function removeStudent(id){if(confirm('Delete this student from the participation list?')){data.students=data.students.filter(x=>x.id!==id);save();students()}}
function exportStudents(){let rows=[['Name','Team','Participations'],...data.students.map(s=>[s.name,s.team,s.count])];let csv=rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='ict-quest-participation.csv';a.click();URL.revokeObjectURL(a.href)}
function mindmaps(){view.innerHTML=`<div class="hero"><div class="eyebrow">CONNECT THE IDEAS</div><h1>Mind Map Library 🧠</h1><p>Choose a lesson, then tap its mind map icon to open the complete visual summary.</p></div><div class="grid2" style="margin-top:18px">${lessons.map((l,i)=>`<div class="card mind-library-card"><span class="tag">UNIT ${l.unit} • LESSON ${l.n}</span><div class="row" style="align-items:center"><div class="mind-library-icon">🧠</div><div><h3>${l.icon} ${esc(l.title)}</h3><p>${esc(l.desc)}</p></div></div><button class="btn small" onclick="openMindMap(${i})">🗺️ Open full mind map</button></div>`).join('')}</div>`}
save();home();
</script></body></html>
